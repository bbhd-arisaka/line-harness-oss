name: Mobile iOS Build (TestFlight 配信)

# iOSアプリ(apps/mobile)を EAS でビルドし、必要なら App Store Connect(TestFlight)へ提出する。手動実行。
# 事前に、リポジトリの Secrets に次を登録しておく:
#   EXPO_TOKEN        ... expo.dev のアクセストークン(登録済み)
#   ASC_KEY_P8        ... App Store Connect API キー(.p8 ファイルの中身そのまま)
# (キーID・発行者ID・チームID は、秘密ではない識別子なので、下の env に直接書いてある)
# 提出先のアプリ(App Store Connect の beyond line / Apple ID 6820799381)は apps/mobile/eas.json に書いてある。
on:
  workflow_dispatch:
    inputs:
      submit:
        description: ビルド後に TestFlight へ提出する
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci
      # ビルドする前に、型チェックとテストを必ず通す
      - run: npx tsc --noEmit
      - run: npm test
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: App Store Connect のキーを、一時ファイルに置く(ログには出さない)
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          set -e
          umask 077
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/asc-key.p8"
          test -s "$RUNNER_TEMP/asc-key.p8"
      - name: iOS をビルド(本番用・TestFlight 向け)
        env:
          EXPO_ASC_API_KEY_PATH: ${{ runner.temp }}/asc-key.p8
          EXPO_ASC_KEY_ID: 8Y9VPP4N35
          EXPO_ASC_ISSUER_ID: d27e3cd5-37fa-46e7-b777-d56ab06f0fbb
          EXPO_APPLE_TEAM_ID: W9LBYJRB5T
          EXPO_APPLE_TEAM_TYPE: COMPANY_OR_ORGANIZATION
          SUBMIT: ${{ inputs.submit }}
        run: |
          if [ "$SUBMIT" = "true" ]; then
            eas build --platform ios --profile production --non-interactive --wait --auto-submit
          else
            eas build --platform ios --profile production --non-interactive --wait
          fi
      - name: キーの一時ファイルを消す
        if: always()
        run: rm -f "$RUNNER_TEMP/asc-key.p8"
